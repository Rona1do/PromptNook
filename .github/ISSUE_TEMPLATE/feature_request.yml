name: Feature request
description: Propose a user problem and a focused improvement.
title: "[Feature]: "
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is difficult today, and who experiences it?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe behavior, not just UI placement.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: network
    attributes:
      label: Does this require network access?
      options:
        - No
        - Optional
        - Yes
        - Unsure
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy and migration impact
      description: Explain data sent, stored, imported, exported, or migrated.
  - type: checkboxes
    id: principles
    attributes:
      label: Product fit
      options:
        - label: I considered local-first behavior and user-controlled workspaces.
          required: true
        - label: I searched existing issues and the roadmap.
          required: true
