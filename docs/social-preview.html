<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, initial-scale=1" />
    <title>PromptNook social preview</title>
    <style>
      * { box-sizing: border-box; }

      html,
      body {
        width: 1280px;
        height: 640px;
        margin: 0;
        overflow: hidden;
        font-family: Inter, "Segoe UI", Arial, sans-serif;
        color: #f8f9ff;
        background: #0b1028;
      }

      body {
        position: relative;
        display: grid;
        grid-template-columns: 510px 1fr;
        gap: 46px;
        padding: 64px 58px;
        background:
          radial-gradient(circle at 15% 22%, rgba(111, 101, 255, 0.33), transparent 34%),
          radial-gradient(circle at 88% 90%, rgba(255, 119, 105, 0.2), transparent 38%),
          linear-gradient(135deg, #0b1028 0%, #121943 56%, #171641 100%);
      }

      body::before {
        content: "";
        position: absolute;
        inset: 0;
        opacity: 0.13;
        background-image:
          linear-gradient(rgba(255,255,255,.08) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,.08) 1px, transparent 1px);
        background-size: 38px 38px;
        mask-image: linear-gradient(to right, #000, transparent 80%);
      }

      .copy,
      .product-shot { position: relative; z-index: 1; }

      .brand {
        display: flex;
        align-items: center;
        gap: 18px;
        margin-bottom: 38px;
      }

      .brand img {
        width: 82px;
        height: 82px;
        object-fit: contain;
        filter: drop-shadow(0 16px 24px rgba(0,0,0,.34));
      }

      .brand-name {
        font-size: 34px;
        font-weight: 760;
        letter-spacing: -0.8px;
      }

      .eyebrow {
        margin-bottom: 14px;
        color: #bcb9ff;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 1.8px;
        text-transform: uppercase;
      }

      h1 {
        max-width: 500px;
        margin: 0;
        font-size: 53px;
        line-height: 1.04;
        letter-spacing: -2.8px;
      }

      .lede {
        max-width: 480px;
        margin: 22px 0 27px;
        color: #d7daf1;
        font-size: 21px;
        line-height: 1.4;
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .chip {
        padding: 9px 14px;
        border: 1px solid rgba(255,255,255,.16);
        border-radius: 999px;
        color: #eaebfb;
        background: rgba(255,255,255,.08);
        font-size: 14px;
        font-weight: 650;
      }

      .meta {
        position: absolute;
        bottom: 5px;
        left: 0;
        color: #aeb4d5;
        font-size: 15px;
        letter-spacing: .25px;
      }

      .product-shot {
        align-self: center;
        width: 660px;
        height: 454px;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,.2);
        border-radius: 25px;
        background: #f7f8fd;
        box-shadow: 0 38px 75px rgba(0,0,0,.42), 0 0 0 8px rgba(255,255,255,.045);
        transform: perspective(1200px) rotateY(-4deg) rotateX(1deg);
      }

      .window-bar {
        height: 42px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 17px;
        background: rgba(242,244,251,.98);
        border-bottom: 1px solid #e1e4ef;
      }

      .dot { width: 11px; height: 11px; border-radius: 50%; }
      .dot:nth-child(1) { background: #ff766f; }
      .dot:nth-child(2) { background: #ffc65a; }
      .dot:nth-child(3) { background: #48c98b; }

      .product-shot img {
        display: block;
        width: 894px;
        height: auto;
        transform: translate(-67px, -3px);
      }

      .privacy {
        position: absolute;
        right: 18px;
        bottom: 17px;
        padding: 9px 13px;
        border: 1px solid rgba(255,255,255,.28);
        border-radius: 12px;
        background: rgba(12,18,48,.86);
        color: #fff;
        font-size: 13px;
        font-weight: 700;
        box-shadow: 0 8px 20px rgba(0,0,0,.24);
      }
    </style>
  </head>
  <body>
    <section class="copy">
      <div class="brand">
        <img src="../public/promptnook-icon.png" alt="" />
        <div class="brand-name">PromptNook</div>
      </div>
      <div class="eyebrow">Open-source desktop app</div>
      <h1>Your prompts deserve more than a text file.</h1>
      <p class="lede">Organize recipes, reusable snippets, generation settings, models and LoRAs in one private workspace.</p>
      <div class="chips">
        <span class="chip">Prompt Studio</span>
        <span class="chip">Model &amp; LoRA catalog</span>
        <span class="chip">Verified backups</span>
      </div>
      <div class="meta">Local-first · Windows · MIT licensed</div>
    </section>

    <section class="product-shot">
      <div class="window-bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
      <img src="screenshots/studio.png" alt="PromptNook Prompt Studio" />
      <div class="privacy">No account · No telemetry</div>
    </section>
  </body>
</html>
